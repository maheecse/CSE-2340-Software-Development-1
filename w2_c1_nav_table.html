<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar & table</title>
  </head>

  <body>
    <header>
      Navigation and table Example
      <nav>
        <ol>
          <li><a href="#table">Table </a></li>
          <li><a href="#form">Form </a></li>
        </ol>
      </nav>
    </header>
    <main>
      <section id="table">
        <h3>Section No 1</h3>
        <table border="1" style="border-collapse: collapse">
          <caption>
            Table Example
          </caption>
          <thead>
            <tr>
              <th>ID</th>
              <th>NAME</th>
              <th>CGPA</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>C253046</td>
              <td>Mahee</td>
              <td>3.55</td>
            </tr>
            <tr>
              <td>C253058</td>
              <td>Mislkat</td>
              <td>3.75</td>
            </tr>
            <tr>
              <td>C253068</td>
              <td>Tahasan</td>
              <td>3.85</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
